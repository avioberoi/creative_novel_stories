# All hyperparameters live here. Parsed once at top of novelty.py main.
# All heavy outputs + caches live under /project/jevans/avi (NEVER $HOME).

paths:
  root:    /project/jevans/avi/novelty_stories
  cache:   /project/jevans/avi/cache
  # the next four are exported as env vars by slurm/*.sbatch:
  hf:      /project/jevans/avi/cache/huggingface
  torch:   /project/jevans/avi/cache/torch
  vllm:    /project/jevans/avi/cache/vllm
  triton:  /project/jevans/avi/cache/triton

models:
  qwen3_emb:    /project/jevans/maxzhuyt/models/Qwen3-Embedding-0.6B
  bge:          /project/jevans/maxzhuyt/models/bge-large-en-v1.5
  e5_mistral:   /project/jevans/maxzhuyt/models/e5-mistral-7b-instruct
  # held-out: Gemma family — structurally distinct from BERT/Mistral/Qwen observers
  emb_gemma:    /project/jevans/maxzhuyt/models/embeddinggemma-300m
  qwen3_32b:    /project/jevans/maxzhuyt/models/Qwen3-32B
  gemma2_27b:   /project/jevans/maxzhuyt/models/gemma-2-27b-it
  qwen3_think:  /project/jevans/maxzhuyt/models/Qwen3-4B-Thinking-2507

corpus:
  text_dir:    /project/jevans/maxzhuyt/narrative_project/NEWCORPUS_CLEANED
  texts_jsonl: /project/jevans/avi/novelty_stories/nyer_texts.jsonl
  emb_dir:     /project/jevans/avi/novelty_stories/embs
  out_dir:     /project/jevans/avi/novelty_stories/runs

search:
  encoder: qwen3_emb          # 768d, samples-per-dim ≈ 1.04 at λ=16, T=50
  observers: [bge, e5_mistral]
  held_out: emb_gemma
  agg: mean                   # min | mean
  k: 15
  metric: euclidean           # euclidean | cosine | mahalanobis | lof | diffusion
  threshold_percentile: 50
  whitening_rank: 256

cma:
  σ0: 0.18
  λ: 16
  maxiter: 50
  diagonal: true
  patience: 15
  min_accept: 0.25

gen:
  vllm_url:  http://${VLLM_HOST}:30000/v1
  model:     qwen3_32b
  K:         5                # retrieval neighbors as in-context examples
  ctx_words: 600              # words per neighbor shown to LLM
  temperature: 0.85
  top_p: 0.95
  max_tokens: 900
  min_tokens: 350

coherence:
  encoder: qwen3_emb
  threshold: 0.55
  length_floor_words: 200
  negatives:
    - "I cannot help with that request"
    - "As an AI language model"
    - "Generic, repetitive prose"
    - "Random words strung together"
    - "Sorry, I cannot generate"

eval:
  litbench_repo: ConicCat/Litbench-Creative-Writing-RM-3B
  litbench_wp: "Write a literary short story opening in the style of contemporary fiction."
  judge_model: gemma2_27b
  judge_n_per_archive: 200    # top-100 novelty + 100 random
  human_top_n: 20
  expand_max_tokens: 5000
